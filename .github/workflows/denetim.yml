name: Denetim (geçici)
on:
  push:
    branches: [tarla-plan]
permissions:
  contents: read
jobs:
  denetle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub upgrade --major-versions firebase_core firebase_auth cloud_firestore flutter_lints
      - run: flutter analyze lib --no-fatal-warnings --no-fatal-infos
      - run: flutter test
