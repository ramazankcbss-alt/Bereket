name: APK Derle

# Kod her güncellendiğinde (ya da Actions sekmesinden elle) APK derlenir
# ve "Releases" bölümüne indirilebilir dosya olarak konur. Telefonlardaki
# uygulama yeni sürümü buradan görüp kendini günceller.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # İmza anahtarının şifresi: Settings → Secrets and variables → Actions
  BEREKET_KEYSTORE_PASSWORD: ${{ secrets.BEREKET_KEYSTORE_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle ve Kotlin indirmelerini sakla (GitHub indirme sunucusu bazen 504 veriyor).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-v1
          restore-keys: gradle-${{ runner.os }}-

      - name: Flutter kur
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Sürüm numarası
        # Eski hesaptaki sürümlerin ve telefondakilerin üzerine kurulabilmesi
        # için numara 1000'den başlar.
        run: echo "SURUM=$((1000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"

      - name: Android proje dosyalarını oluştur
        run: flutter create --platforms=android --org com.kocabas --project-name bereket .

      - name: Android ayarları (uygulama adı, izinler, imza anahtarı)
        run: |
          if [ -z "$BEREKET_KEYSTORE_PASSWORD" ]; then
            echo "::error::İmza şifresi eksik. GitHub → Settings → Secrets and variables → Actions bölümüne BEREKET_KEYSTORE_PASSWORD ekleyin."
            exit 1
          fi
          python3 ci/android_ayarla.py .

      - name: Paketleri güncelle
        run: flutter pub upgrade --major-versions firebase_core firebase_auth cloud_firestore flutter_lints

      - name: Testler
        run: flutter test

      - name: APK derle
        run: |
          # Ağ hatasında (504) 3 kez dene.
          for i in 1 2 3; do
            flutter build apk --release --build-number=$SURUM --dart-define=BUILD_NUMBER=$SURUM && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Derleme başarısız, 60 sn sonra yeniden denenecek ($i/3)"; sleep 60
          done
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/bereket.apk

      - name: İmza kontrolü (güncellemeler eskisinin üzerine kurulabilsin)
        run: python3 ci/imza_kontrol.py build/app/outputs/flutter-apk/bereket.apk ci/bereket.p12

      - name: APK'yı yayınla
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: surum-${{ env.SURUM }}
          name: Bereket - Sürüm ${{ env.SURUM }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            Telefona ilk kez kurmak için aşağıdaki bereket.apk dosyasına dokunun. Uygulama kuruluysa güncelleme uygulamanın içinden gelir.
          files: build/app/outputs/flutter-apk/bereket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
